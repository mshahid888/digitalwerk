# DigitalWerk Agent API — vhost to ADD to the shared pdfwandler Caddyfile
# (/opt/apps/pdfwandler/pdfwandler-backend2/deploy/Caddyfile).
#
# Apply with deploy/digitalwerk/apply-caddy-vhost.sh (appends this block once,
# validates, hot-reloads — no restart, PDF Wandler unaffected).
#
# Prereq: agent.digitalwerkk.de -> 2.28.53.174 resolves. The agent-api
# container attaches itself to pdfwandler_edge (see deploy/digitalwerk/
# compose.yml), so Caddy reaches it by name with no manual network wiring.

agent.digitalwerkk.de {
	import security_headers
	encode zstd gzip

	# JSON API, single upstream — no active health checks (nothing to fail
	# over to; they only add a ~30s recovery lag after a network blip).
	# Caddy returns the real upstream status, incl. the agent's own 503 when
	# it reports "degraded".
	reverse_proxy digitalwerk-agent-api-1:8080 {
		transport http {
			dial_timeout 10s
			response_header_timeout 40s
		}
	}

	log {
		output stdout
		format console
	}
}
