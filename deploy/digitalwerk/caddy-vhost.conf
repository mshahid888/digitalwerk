# DigitalWerk Agent API — vhost to ADD to the shared pdfwandler Caddyfile
# (/opt/apps/pdfwandler/pdfwandler-backend2/deploy/Caddyfile).
#
# Apply with deploy/digitalwerk/apply-caddy-vhost.sh (appends this block once,
# validates, hot-reloads — no restart, PDF Wandler unaffected).
#
# Prereqs: agent.digitalwerkk.de -> 2.28.53.174 resolves, and
#          `docker network connect digitalwerk_edge pdfwandler-caddy-1`.

agent.digitalwerkk.de {
	import security_headers
	encode zstd gzip

	# The agent API is a JSON API (no browser UI). Only the Vercel proxy
	# reaches it, carrying the X-Agent-Auth shared secret; the browser never
	# does. reverse_proxy by container name over the digitalwerk_edge network.
	reverse_proxy digitalwerk-agent-api-1:8080 {
		transport http {
			dial_timeout 10s
			response_header_timeout 40s
		}
		health_uri /
		health_interval 30s
	}

	log {
		output stdout
		format console
	}
}
