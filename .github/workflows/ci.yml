name: CI

on:
  # PRs to main validate the branch; a push to main validates the merge
  # result. Feature-branch pushes are covered by the PR run (no double run).
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches server/Dockerfile (node:22-alpine)
          cache: npm

      - run: npm ci

      - name: Unit + integration tests
        run: npm test

      - name: TypeScript (app + standalone Agent API)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
